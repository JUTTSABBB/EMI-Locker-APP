plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ozzun.emilocker'
    compileSdk 35

    defaultConfig {
        applicationId "com.ozzun.emilocker"
        minSdk 24          // Android 7.0 — needed for modern Device Owner / Lock Task APIs
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            // Debug build: fast, no obfuscation. This is the APK the shop installs for testing.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // Release build: R8 code shrinking + obfuscation (anti-reverse-engineering, Part 2).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
}
