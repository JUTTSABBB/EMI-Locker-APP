plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ozzun.emilocker'
    compileSdk 35

    defaultConfig {
        applicationId "com.ozzun.emilocker"
        minSdk 24          // Android 7.0 — needed for modern Device Owner / Lock Task APIs
        targetSdk 35
        versionCode 2
        versionName "0.2.0"

        // Base URL of the Cloudflare Worker backend. Set it with a Gradle property
        // (-PworkerUrl=https://emi-api.<you>.workers.dev) or an env var WORKER_URL.
        // Empty by default so the app builds anywhere; when empty the app shows "not connected".
        def workerUrl = project.findProperty("workerUrl") ?: System.getenv("WORKER_URL") ?: ""
        buildConfigField "String", "WORKER_URL", "\"${workerUrl}\""
    }

    buildTypes {
        debug {
            // Debug build: fast, no obfuscation. This is the APK the shop installs for testing.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // Release build: R8 code shrinking + obfuscation (anti-reverse-engineering, Part 2).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.work:work-runtime:2.9.1'   // periodic server check-in + lock enforcement

    testImplementation 'junit:junit:4.13.2'
}
