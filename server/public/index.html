<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EMI Locker — Shop Dashboard</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --ink:#e7ebf0; --muted:#9aa4b2;
          --brand:#0B5FFF; --ok:#1DB954; --bad:#ff4d4f; --line:#262b35; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:var(--bg); color:var(--ink); }
  header { padding:20px 24px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:12px; }
  header .dot { width:12px; height:12px; border-radius:50%; background:var(--brand); }
  header h1 { font-size:18px; margin:0; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:18px; margin-bottom:20px; }
  h2 { font-size:15px; margin:0 0 14px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  form { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  input { background:#0c0e12; border:1px solid var(--line); color:var(--ink);
          padding:10px 12px; border-radius:9px; font-size:14px; width:100%; }
  button { cursor:pointer; border:0; border-radius:9px; padding:10px 14px; font-size:14px; font-weight:600; }
  .primary { background:var(--brand); color:#fff; }
  .mini { padding:7px 10px; font-size:12px; }
  .lock { background:var(--bad); color:#fff; }
  .unlock { background:var(--ok); color:#07210f; }
  .paid { background:#243; color:#bfe; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  .badge { padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; }
  .b-locked { background:rgba(255,77,79,.15); color:#ff8f90; }
  .b-ok { background:rgba(29,185,84,.15); color:#5fe08a; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .hint { color:var(--muted); font-size:13px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>EMI Locker · Shop Dashboard</h1>
</header>
<main>
  <div class="card">
    <h2>Enroll a device (point of sale)</h2>
    <form id="enrollForm">
      <input name="device_id" placeholder="Device ID" required />
      <input name="customer_name" placeholder="Customer name" required />
      <input name="cnic" placeholder="CNIC" required />
      <input name="plan" placeholder="Plan (e.g. 12 x 5000)" required />
      <input name="support_number" placeholder="Support number" required />
      <input name="paid_until" placeholder="Paid until (YYYY-MM-DD)" />
      <button class="primary" type="submit">Enroll</button>
    </form>
    <div class="hint">The customer consents to this enrollment at purchase. CNIC is kept as the KYC/consent record.</div>
  </div>

  <div class="card">
    <h2>Devices</h2>
    <table>
      <thead>
        <tr><th>Device</th><th>Customer</th><th>Plan</th><th>Paid until</th><th>State</th><th>Last check-in</th><th>Actions</th></tr>
      </thead>
      <tbody id="deviceRows"><tr><td colspan="7" class="hint">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<script>
async function load() {
  const res = await fetch('/api/devices');
  const devices = await res.json();
  const tbody = document.getElementById('deviceRows');
  if (!devices.length) { tbody.innerHTML = '<tr><td colspan="7" class="hint">No devices yet. Enroll one above.</td></tr>'; return; }
  tbody.innerHTML = devices.map(d => `
    <tr>
      <td>${esc(d.device_id)}</td>
      <td>${esc(d.customer_name)}</td>
      <td>${esc(d.plan)}</td>
      <td>${esc(d.paid_until || '—')}</td>
      <td><span class="badge ${d.effective_locked ? 'b-locked' : 'b-ok'}">${d.effective_locked ? 'LOCKED' : 'ACTIVE'}</span></td>
      <td class="hint">${esc(d.last_checkin || 'never')}</td>
      <td class="row-actions">
        <button class="mini lock"   onclick="act('${esc(d.device_id)}','lock')">Lock</button>
        <button class="mini unlock" onclick="act('${esc(d.device_id)}','unlock')">Unlock</button>
        <button class="mini paid"   onclick="markPaid('${esc(d.device_id)}')">Mark paid</button>
      </td>
    </tr>`).join('');
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function act(id, what) {
  await fetch(`/api/devices/${encodeURIComponent(id)}/${what}`, { method:'POST' });
  load();
}
async function markPaid(id) {
  const date = prompt('Paid until (YYYY-MM-DD):');
  if (!date) return;
  await fetch(`/api/devices/${encodeURIComponent(id)}/mark-paid`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ paid_until: date })
  });
  load();
}
document.getElementById('enrollForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target).entries());
  const res = await fetch('/api/enroll', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (res.ok) { e.target.reset(); load(); } else { const j = await res.json(); alert(j.error || 'error'); }
});
load();
</script>
</body>
</html>
